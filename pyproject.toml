[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sankofa-mini-pc"
version = "0.1.0"
description = "Turn an Android phone into a self-hosted local AI mini PC."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AI With Enoch"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "psutil>=6,<8",
  "pydantic>=2.8,<3"
]

[project.scripts]
sankofa = "sankofa.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["sankofa*"]

[tool.setuptools.package-data]
sankofa = ["static/*"]
