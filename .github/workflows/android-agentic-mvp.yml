name: Android Agentic MVP

on:
  push:
    branches:
      - main
      - feature/android-agentic-mvp
    paths:
      - 'android/**'
      - 'gateway/**'
      - '.github/workflows/android-agentic-mvp.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'gateway/**'
      - '.github/workflows/android-agentic-mvp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    name: Gateway type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix gateway
      - run: npm run --prefix gateway check

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: sankofa-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
